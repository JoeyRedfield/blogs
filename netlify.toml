# Netlify 部署配置：连接仓库后即可按此构建
[build]
  command = "npm i -g sass@1.108.2 && hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.170.1"
  HUGO_ENV = "production"
  TZ = "Asia/Shanghai"

# 静态站点无需 Netlify Functions；如需重定向写在这里
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
